<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Процентный таймер</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:#111; color:#fff; font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  }
  .card{
    width:min(92vw,560px); padding:32px; border-radius:24px;
    background:#1b1b1b; box-shadow:0 20px 60px #0008; text-align:center;
  }
  h1{margin:0 0 20px;font-size:25px}
  .percent{font-size:clamp(58px,16vw,100px);font-weight:800;letter-spacing:-4px;margin:10px 0 22px}
  .bar{height:12px;background:#333;border-radius:20px;overflow:hidden;margin-bottom:28px}
  .fill{height:100%;width:0;background:#fff;border-radius:20px;transition:width .1s linear}
  .inputs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  input{
    width:105px;padding:13px;border:1px solid #444;border-radius:12px;
    background:#292929;color:#fff;font-size:18px;text-align:center;
  }
  button{
    border:0;border-radius:12px;padding:13px 20px;font-size:17px;
    cursor:pointer;background:#fff;color:#111;font-weight:650;
  }
  button.secondary{background:#333;color:#fff}
  .buttons{display:flex;gap:10px;justify-content:center;margin-top:14px}
  .hint{color:#aaa;font-size:14px;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <h1>Процентный таймер</h1>
  <div class="percent" id="percent">0.00%</div>
  <div class="bar"><div class="fill" id="fill"></div></div>

  <div class="inputs">
    <input id="hours" type="number" min="0" value="1" placeholder="Часы">
    <input id="minutes" type="number" min="0" max="59" value="0" placeholder="Мин">
    <input id="seconds" type="number" min="0" max="59" value="0" placeholder="Сек">
  </div>

  <div class="buttons">
    <button id="start">Старт</button>
    <button id="pause" class="secondary">Пауза</button>
    <button id="reset" class="secondary">Сброс</button>
  </div>
  <div class="hint">Процент растёт от 0.00% до 100.00% за заданное время.</div>
</div>

<script>
let total=3600, startTime=null, elapsed=0, running=false, raf=null;

const $=id=>document.getElementById(id);
function getTotal(){
  const h=Math.max(0,Number($('hours').value)||0);
  const m=Math.max(0,Number($('minutes').value)||0);
  const s=Math.max(0,Number($('seconds').value)||0);
  return h*3600+m*60+s;
}
function render(){
  const p=Math.min(1, elapsed/total);
  $('percent').textContent=(p*100).toFixed(2)+'%';
  $('fill').style.width=(p*100)+'%';
}
function loop(now){
  if(!running)return;
  elapsed=(now-startTime)/1000;
  if(elapsed>=total){
    elapsed=total; running=false; render();
    $('start').textContent='Старт';
    return;
  }
  render();
  raf=requestAnimationFrame(loop);
}
$('start').onclick=()=>{
  if(running)return;
  if(elapsed===0 || elapsed>=total){
    total=getTotal();
    if(total<=0)return;
  }
  startTime=performance.now()-elapsed*1000;
  running=true;
  $('start').textContent='Идёт...';
  raf=requestAnimationFrame(loop);
};
$('pause').onclick=()=>{
  if(!running)return;
  running=false;
  cancelAnimationFrame(raf);
  $('start').textContent='Продолжить';
};
$('reset').onclick=()=>{
  running=false; cancelAnimationFrame(raf); elapsed=0;
  $('start').textContent='Старт'; render();
};
['hours','minutes','seconds'].forEach(id=>{
  $(id).addEventListener('change',()=>{ if(!running){elapsed=0; total=getTotal(); render();}});
});
render();
</script>
</body>
</html>
